# Shopify app configuration for Vantora.
# client_id below is the Partner Dashboard app's API key (public, safe to commit).
# The API secret is NEVER stored here -- it lives only in SHOPIFY_API_SECRET
# on the Laravel backend (Railway env var / .env, both gitignored).

client_id = "d1d5b3a6a9a3e2a96d71715bc6a13a84"
name = "Vantora"
application_url = "https://vantora-production.up.railway.app/"
embedded = true

[app_proxy]
url = "https://vantora-production.up.railway.app/apps/vantora"
subpath = "vantora"
prefix = "apps"

[access_scopes]
# Phase 1 scope only (spec section 9) -- read_products/read_themes for
# audit and theme-compatibility groundwork. Every other scope this app
# will eventually need (write_products for the AI optimizer, discount/
# metafield/pixel scopes for later phases) gets added when that phase
# actually starts, not requested up front.
scopes = "read_products,read_themes"

[auth]
redirect_urls = [
  "https://vantora-production.up.railway.app/auth/callback"
]

[webhooks]
# Kept in sync with SHOPIFY_API_VERSION (backend Admin GraphQL calls) and
# every extension's own api_version -- mixing versions across the same app
# risks a webhook payload shape or GraphQL field that was verified against
# one version silently not matching what's actually delivered/available.
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/app-subscriptions-update"

  [[webhooks.subscriptions]]
  topics = ["shop/update"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/shop-update"

  [[webhooks.subscriptions]]
  topics = ["themes/publish"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/themes-publish"

  [[webhooks.subscriptions]]
  topics = ["themes/update"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/themes-update"

  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/products-update"

  [[webhooks.subscriptions]]
  topics = ["products/delete"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/products-delete"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/orders-create"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/customers-data-request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/customers-redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "https://vantora-production.up.railway.app/webhooks/shopify/shop-redact"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
